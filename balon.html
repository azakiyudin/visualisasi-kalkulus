athz" target="_blank" rel="noopener"><svg viewBox="0 0 448 512" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg><span>belajar.ahmathz</span></a></nav></div></footer>
<script src="base.js"></script>
<script>
const CX=260,CY=190,S=12;let mode=0;
lab('lr','r','#fff');lab('lq','');$('lr').querySelector('.lab').style.cssText+=';text-shadow:0 0 3px #000,0 0 3px #000;font-size:17px;font-weight:700';
const SOAL=['Balon bulat dikembangkan sehingga volumenya bertambah dengan laju 3 \\(\\mathrm{cm}^{3}/\\mathrm{menit}\\). Seberapa cepat diameter balon bertambah saat jari-jarinya 10 cm? (Satuan laju volume pada buku tertulis cm/menit; diperlakukan sebagai \\(\\mathrm{cm}^{3}/\\mathrm{menit}\\).)',
 'Balon bulat digembosi sehingga jari-jarinya berkurang dengan laju 15 cm/menit. Jika jari-jarinya 9 cm, berapa laju gerak udara (laju perubahan volume)?'];
function setMode(m){
  mode=m;stop();$('soal').textContent=SOAL[m];$('r').value=m?9:10;
  $('l1').innerHTML=m?'\\(\\frac{dr}{dt}\\) (cm/menit)':'\\(\\frac{dV}{dt}\\) (\\(\\mathrm{cm}^{3}/\\mathrm{menit}\\))';
  $('l2').innerHTML=m?'\\(\\frac{dV}{dt}=4\\pi r^2\\frac{dr}{dt}\\) (\\(\\mathrm{cm}^{3}/\\mathrm{menit}\\))':'\\(\\frac{d(2r)}{dt}=\\frac{3}{2\\pi r^2}\\) (cm/menit)';
  $('lq').querySelector('.lab').innerHTML='\\('+(m?'\\frac{dr}{dt}=-15':'\\frac{dV}{dt}=3')+'\\)';
  $('m0').classList.toggle('on',!m);$('m1').classList.toggle('on',!!m);
  draw();rm($('soal'));rm(document.querySelector('.g'));rm($('lq'));
}
function draw(){
  const r=+$('r').value,R=r*S,V=4/3*Math.PI*r**3;
  set('bl',{cx:CX,cy:CY,r:R});set('hi',{cx:CX-R*.35,cy:CY-R*.4,rx:R*.18,ry:R*.1,transform:`rotate(-35 ${CX-R*.35} ${CY-R*.4})`});
  set('kn',{d:`M${CX},${CY+R} l-7,10 h14 Z`});set('tl',{x1:CX,y1:CY+R+10,x2:CX+8,y2:CY+R+60});
  set('rl',{x1:CX,y1:CY,x2:CX+R,y2:CY});set('ci',{cx:CX,cy:CY});put('lr',CX+R/2,CY-16);
  const o=mode?-1:1;
  set('ar1',{x1:CX-R-14*o,y1:CY,x2:CX-R-14*o-o*28,y2:CY});set('ar2',{x1:CX+R+14*o,y1:CY,x2:CX+R+14*o+o*28,y2:CY});
  put('lq',CX+R+70,CY-40);
  $('vr').textContent=r.toFixed(2);$('oV').textContent=V.toFixed(1);
  if(mode){$('o1').textContent='-15';$('o2').textContent=(4*Math.PI*r*r*-15).toFixed(1)}
  else{$('o1').textContent='3';$('o2').textContent=(3/(2*Math.PI*r*r)).toFixed(5)}
  note(mode?(Math.abs(r-9)<.06?'Saat \\(r=9\\): \\(\\frac{dV}{dt}=4\\pi(81)(-15)=-4860\\pi\\approx-15\\,268\\) \\(\\mathrm{cm}^{3}/\\mathrm{menit}\\). Udara keluar \\(4860\\pi\\) \\(\\mathrm{cm}^{3}\\) tiap menit.':'Tekan Reset untuk kembali ke \\(r=9\\).')
    :(Math.abs(r-10)<.06?'Saat \\(r=10\\): \\(3=4\\pi(100)\\frac{dr}{dt}\\Rightarrow\\frac{dr}{dt}=\\frac{3}{400\\pi}\\), sehingga diameter \\(2r\\) bertambah \\(\\frac{3}{200\\pi}\\approx0{,}0048\\) cm/menit.':'Tekan Reset untuk kembali ke \\(r=10\\). Makin besar balon, makin lambat jari-jarinya bertambah.'));
}
let tm=null;
function stop(){clearInterval(tm);tm=null;$('p').textContent='Putar'}
$('p').onclick=()=>{
  if(tm){stop();return}
  $('p').textContent='Berhenti';let r=+$('r').value,V=4/3*Math.PI*r**3;
  if(mode&&r<=2.1)r=14;if(!mode&&r>=13.9)r=2;V=4/3*Math.PI*r**3;
  tm=setInterval(()=>{if(mode)r-=.04;else{V+=6;r=Math.cbrt(3*V/(4*Math.PI))}
    if(r<=2||r>=14){r=Math.min(14,Math.max(2,r));stop()}$('r').value=r;draw()},30)};
$('r').addEventListener('input',stop);$('z').onclick=()=>{stop();setMode(mode)};
$('m0').onclick=()=>setMode(0);$('m1').onclick=()=>setMode(1);
start(()=>{if(!window._i){window._i=1;setMode(0)}draw()},['r']);
</script>
